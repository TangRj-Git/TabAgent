[project]
name = "tabagent"
version = "0.1.0"
description = "An asynchronous Python agent harness with composable middleware, streaming responses, tool calling, and a standalone MCP client."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "agent",
    "agent-harness",
    "llm",
    "asyncio",
    "middleware",
    "tool-calling",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [
    { name = "TangRuoJie", email = "3177065378@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.1",
    "loguru>=0.7.3",
    "mcp-types>=2.3.0,<3",
    "openai>=3.29.0",
    "pydantic>=2.14.1,<3",
]

[project.urls]
Repository = "https://github.com/TangRj-Git/TabAgent"
Issues = "https://github.com/TangRj-Git/TabAgent/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["test"]
