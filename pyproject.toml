[project]
name = "tabagent"
version = "0.1.0"
description = "An asynchronous Python agent harness with streamed responses and function calling."
readme = "README.md"
keywords = ["agent", "llm", "asyncio", "function-calling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [
    { name = "Administrator", email = "3177065378@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.1",
    "loguru>=0.7.3",
    "openai>=3.29.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
tabagent = "tabagent:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["test"]
